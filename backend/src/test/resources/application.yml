spring:
  application:
    name: loan-system-test

  datasource:
    url: jdbc:h2:mem:loantestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml

app:
  jwt:
    secret: makers-super-secret-bank-loan-jwt-key-2026-production-grade-32bytes
    expiration-hours: 24
