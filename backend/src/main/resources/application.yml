server:
  port: ${PORT:8081}

spring:
  application:
    name: loan-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loan_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# Configuración de JWT
app:
  jwt:
    secret: makers-super-secret-bank-loan-jwt-key-2026-production-grade-32bytes
    expiration-hours: 24

# Documentación OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    com.makers.loansystem: INFO
    org.springframework.security: WARN
